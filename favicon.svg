<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F203C"/>
      <stop offset="100%" stop-color="#050C1A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E3A66" stroke-width="8"/>

  <!-- Outer Pyramid -->
  <path d="M256 72L56 424H456L256 72Z" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Pyramid Layer -->
  <path d="M256 184L144 360H368L256 184Z" fill="#00D2FF" fill-opacity="0.25" stroke="#00D2FF" stroke-width="20" stroke-linejoin="round"/>
</svg>
