<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(30, 58, 138, 0.08)" stroke-width="8"/>

  <!-- Unique Faceted Summit & Ribbon -->
  <!-- Left Peak (Back Left) -->
  <path d="M176 160 L64 400 L176 400 Z" fill="#1E3A8A" fill-opacity="0.45"/>
  <path d="M176 160 L176 400 L288 400 Z" fill="#475569" fill-opacity="0.35"/>
  
  <!-- Right Peak (Back Right) -->
  <path d="M336 160 L224 400 L336 400 Z" fill="#1E3A8A" fill-opacity="0.35"/>
  <path d="M336 160 L336 400 L448 400 Z" fill="#475569" fill-opacity="0.25"/>
  
  <!-- Ribbon Back Segment -->
  <path d="M32 384 C112 384, 176 352, 240 296" fill="none" stroke="#475569" stroke-width="40" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Center Peak (Front Center) -->
  <path d="M256 80 L128 400 L256 400 Z" fill="#1E3A8A" fill-opacity="0.95"/>
  <path d="M256 80 L256 400 L384 400 Z" fill="#475569" fill-opacity="0.75"/>
  
  <!-- Ribbon Front Segment -->
  <path d="M240 296 C304 240, 384 176, 480 128" fill="none" stroke="#1E3A8A" stroke-width="48" stroke-linecap="round"/>
</svg>
